services:
  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    container_name: brasaland-interfaces
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - ./.env
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./uis/website:/app/website
      - ./uis/backoffice:/app/backoffice
      - website_node_modules:/app/website/node_modules
      - backoffice_node_modules:/app/backoffice/node_modules
    command: sh -c "cd /app/website && npm run dev -- --hostname 0.0.0.0 --port 3000 & cd /app/backoffice && npm run dev -- --hostname 0.0.0.0 --port 3001 & wait"
    depends_on:
      - backend
    networks:
      - brasaland-network
    restart: unless-stopped

  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: brasaland-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - ./services/api:/app/api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - brasaland-network
    restart: unless-stopped

networks:
  brasaland-network:
    driver: bridge

volumes:
  website_node_modules:
  backoffice_node_modules:
