# Entorno de desarrollo (ticket #infra-40): `docker compose up` desde la raíz del repo.
#
# Todos los valores salen del .env de la raíz (copia .env.example). Aquí no hay ningún
# secreto: los ${VAR:?} obligan a definirlos en .env y los ${VAR:-x} son los mismos valores
# por defecto que ya aplica el código.
#
# Navegador (host) -> localhost:<puerto publicado>. Contenedor -> contenedor: nombre de
# servicio (`backend`, `interfaces`) dentro de la red trackflow-net, nunca localhost.

name: trackflow

services:
  interfaces:
    build:
      context: ./uis
    init: true
    command: ["start.sh"]
    ports:
      - "${WEBSITE_PORT:-3000}:3000"
      - "${BACKOFFICE_PORT:-3001}:3001"
    environment:
      # Petición servidor a servidor (start.sh): por nombre de servicio Docker.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
      # Las usa el navegador del usuario, que está fuera de la red Docker: van al puerto publicado.
      NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-http://localhost:3000/}
      # Telemetría del backoffice: también la usa el navegador, así que va al puerto publicado.
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:-http://localhost:8000/telemetry/events}
      # Recarga en caliente sobre bind mounts (Windows/macOS no propagan eventos de archivos).
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
    volumes:
      - ./uis:/app
      # Las dependencias del contenedor (instaladas en la imagen) no se pisan con las del host.
      - /app/backoffice/node_modules
      - /app/backoffice/.next
    depends_on:
      - backend
    networks:
      - trackflow-net

  backend:
    build:
      context: ./services
    command:
      - uvicorn
      - services.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - services
      - --reload-dir
      - scripts
      - --reload-dir
      - packages
      - --reload-dir
      - data
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY en .env (copia .env.example)}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en .env (copia .env.example)}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PASSWORD_RESET_LOG_LINK: ${PASSWORD_RESET_LOG_LINK:-false}
      EMAIL_FROM: ${EMAIL_FROM:-TrackFlow <onboarding@resend.dev>}
      # Enlace que se abre en el navegador (correo de reset): URL publicada del backoffice.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      PASSWORD_RESET_MAX_PER_HOUR: ${PASSWORD_RESET_MAX_PER_HOUR:-5}
      # Orígenes (del navegador) a los que la API permite llamar: el backoffice.
      BACKOFFICE_CORS_ORIGINS: ${BACKOFFICE_CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-fastembed}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-http://localhost:8000/telemetry/events}
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-development}
      # Pipeline de desempeño de negocio (hito 19): ver .env.example.
      REPORTING_ENVIRONMENT: ${REPORTING_ENVIRONMENT:-}
      REPORTING_TRIGGER_MODE: ${REPORTING_TRIGGER_MODE:-local}
      PREFECT_API_URL: ${PREFECT_API_URL:-}
    volumes:
      # La API se importa como services.api.main desde /app e importa scripts/ y packages/.
      - ./services:/app/services
      # Esquemas de telemetría con los que la API valida sus eventos y los del backoffice.
      - ./event-schemas.json:/app/event-schemas.json:ro
      - ./scripts:/app/scripts
      - ./packages:/app/packages
      # Pipelines de datos (hito 19): services/reporting/ importa data.pipelines.
      - ./data:/app/data
      # Modelo de fastembed (~220 MB): se descarga una vez y se conserva entre reinicios.
      - fastembed-cache:/root/.cache/fastembed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - trackflow-net

  # Job nocturno de telemetría (hito 21, ticket #DEV-53): scripts/nightly_export.py cada día a las
  # 02:30 UTC (docker/scheduler/crontab). Contenedor aparte del backend: no comparte proceso ni
  # hilo con FastAPI. Registra cada ejecución en job_runs; el pipeline, en reporting.pipeline_runs.
  #   docker compose logs -f nightly-export                                    # sus logs
  #   docker compose run --rm nightly-export python scripts/nightly_export.py  # ejecutarlo ya
  #   docker compose run --rm -e TARGET_DATE=2026-11-15 nightly-export python scripts/nightly_export.py
  nightly-export:
    build:
      context: ./services
      dockerfile: ../docker/scheduler/Dockerfile
      additional_contexts:
        scheduler: ./docker/scheduler
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en .env (copia .env.example)}
      # El pipeline (subproceso) carga la configuración de la API, que exige estas dos.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY en .env (copia .env.example)}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-development}
      REPORTING_ENVIRONMENT: ${REPORTING_ENVIRONMENT:-}
      REPORTING_READER_DATABASE_URL: ${REPORTING_READER_DATABASE_URL:-}
      REPORTING_WRITER_DATABASE_URL: ${REPORTING_WRITER_DATABASE_URL:-}
      PREFECT_API_URL: ${PREFECT_API_URL:-}
      JOB_RUNS_DATABASE_URL: ${JOB_RUNS_DATABASE_URL:-}
      NIGHTLY_EXPORT_PIPELINE_TIMEOUT_MINUTES: ${NIGHTLY_EXPORT_PIPELINE_TIMEOUT_MINUTES:-}
      NIGHTLY_EXPORT_STALE_AFTER_MINUTES: ${NIGHTLY_EXPORT_STALE_AFTER_MINUTES:-}
      # El pipeline importa services/database.py, que abre TinyDB al importarse: un archivo propio
      # del contenedor, para no tocar nunca el services/api/db.json del backend.
      TINYDB_PATH: /tmp/scheduler-tinydb.json
    volumes:
      - ./services:/app/services
      - ./scripts:/app/scripts
      # El pipeline (data/pipelines) y los CSV de backup (data/raw), que quedan en el host.
      - ./data:/app/data
    networks:
      - trackflow-net

networks:
  trackflow-net:
    name: trackflow-net

volumes:
  fastembed-cache:
