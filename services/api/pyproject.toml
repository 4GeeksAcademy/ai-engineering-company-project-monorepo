[project]
name = "trackflow-supplier-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.6,<3.0",
    "tinydb>=4.8,<5.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "email-validator>=2.1,<3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["seed"]

[tool.pytest.ini_options]
pythonpath = ["../.."]