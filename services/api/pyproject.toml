[project]
name = "healthcore-api"
version = "0.1.0"
description = "HealthCore Digital API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "python-multipart>=0.0.9",
    "tinydb>=4.8,<5.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.0"]

[project.scripts]
seed = "routes.seed:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "models.py", "database.py", "routes"]
