[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brasaland-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "tinydb>=4.8.0",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.0",
    "resend>=2.49.0",
    "sqlmodel>=0.0.48",
    "psycopg2-binary>=2.9.13",
    "pandas>=2.2",
]

[project.scripts]
seed = "seed:main"
seed-users = "seed_users:main"
seed-incidents = "seed_incidents:main"
seed-inventory = "seed_inventory:main"
benchmark = "benchmark_endpoints:main"
generate-events = "generate_events:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.0",
]
codegen = [
    "datamodel-code-generator>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
