[project]
name = "healthcore-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "tinydb>=4.8.2",
    "pydantic>=2.9.0",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["seed", "models", "database", "main", "run"]

[tool.setuptools.packages.find]
include = ["routes*"]
