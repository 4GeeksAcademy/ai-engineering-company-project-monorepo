[project]
name = "trackflow-api"
version = "0.1.0"
description = "TrackFlow backend API"
requires-python = ">=3.11"
dependencies = [
  "bcrypt<4.1",
  "fastapi>=0.141.1",
  "flask==3.0.3",
  "passlib[bcrypt]>=1.7.4",
  "pydantic==2.9.2",
  "pydantic-settings>=2.14.2",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.32",
  "sendgrid>=6.12.5",
  "tinydb==4.8.0",
  "uvicorn>=0.52.0",
]

[project.scripts]
seed = "src.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
