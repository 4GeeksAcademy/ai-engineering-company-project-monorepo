[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexova-api"
version = "0.1.0"
description = "Nexova centralized FastAPI backend."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "tinydb>=4.8",
    "incidents-analyzer",
]

[project.scripts]
seed = "seed:main"

[tool.uv.sources]
incidents-analyzer = { path = "../../packages/incidents_analyzer", editable = true }

[tool.setuptools]
py-modules = ["main", "seed", "models", "database"]

[tool.setuptools.packages.find]
include = ["core*", "incidents*", "routes*"]
