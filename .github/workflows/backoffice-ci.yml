name: Backoffice CI

on:
  push:
    paths:
      - "uis/backoffice/**"
      - ".github/workflows/backoffice-ci.yml"
  pull_request:
    paths:
      - "uis/backoffice/**"
      - ".github/workflows/backoffice-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backoffice-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and build backoffice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uis/backoffice

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uis/backoffice/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
