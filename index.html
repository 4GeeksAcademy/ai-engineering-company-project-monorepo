<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Engineering Company Project</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .container {
        max-width: 640px;
        text-align: center;
      }
      h1 {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1.1rem;
        line-height: 1.7;
        color: #94a3b8;
        margin-bottom: 2rem;
      }
      .links {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .links a {
        color: #60a5fa;
        text-decoration: none;
        padding: 0.5rem 1.25rem;
        border: 1px solid #334155;
        border-radius: 8px;
        font-size: 0.95rem;
        transition: all 0.2s;
      }
      .links a:hover {
        border-color: #60a5fa;
        background: rgba(96, 165, 250, 0.1);
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        background: #1e293b;
        border-radius: 20px;
        font-size: 0.8rem;
        color: #64748b;
        margin-bottom: 1.5rem;
      }
      .section-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: #94a3b8;
        margin: 2.5rem 0 1rem;
      }
      .featured-link {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: #fff;
        font-weight: 600;
        border-radius: 10px;
        text-decoration: none;
        font-size: 1rem;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .featured-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">4Geeks Academy — AI Engineering</div>
      <h1>AI Engineering Company Project</h1>
      <p>
        Base template for transversal projects in the AI Engineering Career
        Program. Build real-world solutions for Brasaland, TrackFlow, and
        Nexova.
      </p>
      <div class="links">
        <a href="/README.md">README</a>
        <a href="/CONTEXT.md">Context</a>
        <a href="/README.es.md">Español</a>
        <a href="https://4geeksacademy.com">4Geeks Academy</a>
      </div>

      <div class="section-title">Milestone Projects</div>
      <a class="featured-link" href="http://localhost:4174" target="_blank">
        🚀 Talent Pipeline Tracker
      </a>
    </div>
  </body>
</html>
