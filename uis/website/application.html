<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Página de registro de talento de Nexova."
    />
    <meta name="theme-color" content="#0b172a" />
    <title>Registro de talento | Nexova</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <a
      class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-white focus:px-4 focus:py-3 focus:text-slate-950 focus:shadow-lg"
      href="#contenido"
    >
      Saltar al contenido principal
    </a>

    <header class="bg-slate-950 text-white">
      <div
        class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5 sm:px-8 lg:px-12"
      >
        <a
          class="text-2xl font-semibold tracking-tight"
          href="index.html"
          aria-label="Nexova, volver al inicio"
        >
          Nexova<span class="text-teal-400">.</span>
        </a>
        <a
          class="text-sm font-medium text-slate-300 transition-colors hover:text-teal-300 focus-visible:text-teal-300"
          href="index.html"
        >
          Volver al inicio
        </a>
      </div>
    </header>

    <main
      id="contenido"
      class="mx-auto flex min-h-[70vh] max-w-3xl items-center px-5 py-16 sm:px-8"
    >
      <section
        class="w-full rounded-3xl border border-slate-200 bg-white p-7 shadow-sm sm:p-10"
        aria-labelledby="application-title"
      >
        <p
          class="text-sm font-semibold uppercase tracking-[0.16em] text-teal-700"
        >
          Nexova · Talento
        </p>
        <h1
          id="application-title"
          class="mt-4 text-3xl font-semibold tracking-tight text-slate-950 sm:text-4xl"
        >
          Registro de talento
        </h1>
        <p class="mt-4 max-w-xl leading-7 text-slate-600">
          Esta página está preparada para el formulario de registro. El
          formulario se incorporará en una siguiente etapa.
        </p>
      </section>
    </main>
  </body>
</html>
