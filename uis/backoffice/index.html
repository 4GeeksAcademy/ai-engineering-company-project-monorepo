<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasaland Business KPIs</title>
    <link rel="stylesheet" href="/backoffice/theme.css">
    <script src="/backoffice/theme.js"></script>
</head>
<body>
    <main class="page">
        <div class="page-header">
            <h1>Brasaland Leadership Dashboard</h1>
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle light or dark mode">Dark mode</button>
        </div>

        <nav class="nav-links" aria-label="Backoffice navigation">
            <a href="/backoffice/">KPI Dashboard</a>
            <a href="/backoffice/telemetry.html">Telemetry</a>
            <a href="/knowledge/">Knowledge Assistant</a>
        </nav>

        <p class="subtitle" id="week-label">Loading KPIs...</p>

        <table>
            <thead>
                <tr>
                    <th>Location</th>
                    <th>Country</th>
                    <th>Total Purchase Cost</th>
                    <th>Total Waste Cost</th>
                    <th>Waste Ratio</th>
                    <th>Stockout Events</th>
                    <th>Price Alerts</th>
                </tr>
            </thead>
            <tbody id="kpi-body">
                <tr><td colspan="7">Loading data...</td></tr>
            </tbody>
        </table>
    </main>

    <script>
        async function loadKPIs() {
            const weekLabel = document.getElementById('week-label');
            const tbody = document.getElementById('kpi-body');

            try {
                const res = await fetch('/reporting/weekly-location-performance');
                if (!res.ok) {
                    throw new Error(`Request failed (${res.status})`);
                }

                const data = await res.json();
                weekLabel.textContent = `Performance for week starting: ${data.week_start || 'N/A'}`;

                if (!data.locations || data.locations.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7">No data available for this period.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.locations.map((loc) => `
                    <tr>
                        <td><strong>${loc.location_id}</strong></td>
                        <td>${loc.country}</td>
                        <td>${loc.currency} ${loc.total_purchase_cost}</td>
                        <td>${loc.currency} ${loc.total_waste_cost}</td>
                        <td>${(loc.waste_ratio * 100).toFixed(1)}%</td>
                        <td>${loc.stockout_events_count}</td>
                        <td>${loc.price_alert_events_count}</td>
                    </tr>
                `).join('');
            } catch (err) {
                weekLabel.textContent = '';
                tbody.innerHTML = `<tr><td colspan="7" class="text-error">Error loading KPIs: ${err.message}</td></tr>`;
            }
        }

        loadKPIs();
    </script>
</body>
</html>
