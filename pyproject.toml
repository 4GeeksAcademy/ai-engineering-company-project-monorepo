[project]
name = "brasaland-api"
version = "0.1.0"
description = "Brasaland supplier directory API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "tinydb>=4.8",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.3",
    "python-multipart>=0.0.32",
    "resend>=2.49.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
seed = "services.api.seed:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
