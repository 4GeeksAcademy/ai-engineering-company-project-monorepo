[project]
name = "nexova-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "tinydb",
    "pydantic",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.3",
    "python-multipart>=0.0.32",
]

[project.scripts]
seed = "services.api.seed:run_seed"

[tool.setuptools]
packages = ["services", "services.api"]
