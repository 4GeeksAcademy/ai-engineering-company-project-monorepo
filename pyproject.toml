[project]
name = "trackflow-supplier-directory"
version = "0.1.0"
description = "TrackFlow supplier directory with FastAPI and TinyDB"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "tinydb>=4.8.2,<5.0.0",
    "uvicorn>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=8.4.1,<9.0.0",
]

[project.scripts]
seed = "services.api.seed:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["services/api/tests"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

