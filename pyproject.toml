[project]
name = "ai-engineering-company-project-monorepo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeff", email = "jefersonzambrano17@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "libpass[bcrypt]>=1.9.3",
    "python-multipart>=0.0.20",
    "pandas>=2.2.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "tinydb>=4.9.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-engineering-company-project-monorepo = "ai_engineering_company_project_monorepo:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
